[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freecad-codex-sidebar"
version = "0.1.0"
description = "Scoped Codex task control for the FreeCAD AI sidebar"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[project.scripts]
freecad-codex-provider = "freecad_codex.provider_proxy:main"

[tool.setuptools.packages.find]
where = ["src"]
